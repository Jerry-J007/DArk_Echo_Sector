    <script>

        // SPAWN ENEMIES ONCE 
        EnemyFactory.spawnWave(gameState);

        function main_game_loop(timestamp) {
            let dt = (timestamp - gameState.lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; 
            gameState.lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(main_game_loop);
        }

        requestAnimationFrame(main_game_loop);
